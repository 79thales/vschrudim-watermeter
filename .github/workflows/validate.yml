name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-home-assistant:
    name: Latest stable Home Assistant compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install exact latest stable HA from PyPI
        run: |
          requirement="$(python scripts/latest_ha_requirement.py)"
          # Nejprve ověříme aktuální core bez závislosti na vydání testovacího pluginu.
          echo "HA_REQUIREMENT=$requirement" >> "$GITHUB_ENV"
          python -m pip install "$requirement"
      - name: Run compatibility checks without skipping HA
        run: python -m unittest discover -s tests -v
      - name: Install test plugin only for the exact tested HA
        run: |
          # Chybějící přesná shoda je chyba CI; pip nesmí zvolit historický plugin.
          plugin_requirement="$(python scripts/latest_ha_requirement.py --test-plugin-for "$HA_REQUIREMENT")"
          python -m pip install "$HA_REQUIREMENT" "$plugin_requirement"
          python -m pip check
      - name: Install the frontend pinned by the tested HA
        run: |
          # Test načítá skutečný frontend, který základní balík HA neinstaluje.
          frontend_requirement="$(python -c 'import json, pathlib, homeassistant; p = pathlib.Path(homeassistant.__file__).parent / "components/frontend/manifest.json"; print(next(x for x in json.loads(p.read_text())["requirements"] if x.startswith("home-assistant-frontend==")))')"
          python -m pip install "$frontend_requirement"
          python -m pip check
      - name: Test real config flows and registry preservation on latest stable HA
        run: python -m pytest -q tests_homeassistant

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: python -m compileall -q custom_components scripts
      - run: python -m unittest discover -s tests -v
      - name: Test bezpečného generování horní záložky
        run: node --test tests/test_dashboard_frontend.mjs
  home-assistant-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Plugin HA má přesnou závislost na core; každá dvojice je ověřená.
        include:
          - home-assistant-version: "2026.8.0"
            test-plugin-version: "0.13.354"
          - home-assistant-version: "2026.9.0"
            test-plugin-version: "0.13.363"
          - home-assistant-version: "2026.10.2"
            test-plugin-version: "0.13.373"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: >-
          python -m pip install
          "homeassistant==${{ matrix.home-assistant-version }}"
          "pytest-homeassistant-custom-component==${{ matrix.test-plugin-version }}"
      - name: Install the frontend pinned by the tested HA
        run: |
          # Verzi přebíráme z manifestu právě nainstalovaného Home Assistantu.
          frontend_requirement="$(python -c 'import json, pathlib, homeassistant; p = pathlib.Path(homeassistant.__file__).parent / "components/frontend/manifest.json"; print(next(x for x in json.loads(p.read_text())["requirements"] if x.startswith("home-assistant-frontend==")))')"
          python -m pip install "$frontend_requirement"
          python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Test real config flows and registry preservation
        run: python -m pytest -q tests_homeassistant
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
